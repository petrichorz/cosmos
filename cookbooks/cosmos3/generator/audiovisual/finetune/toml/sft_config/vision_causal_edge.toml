# Scheme-B causal counterpart of vision_sft_edge.toml. Training, data, optimizer,
# scheduler, parallelism, and checkpoint settings stay aligned with the Edge recipe.
# Each packed sample independently samples its block/history geometry; sigma is
# shared by latent frames in the same causal block and sampled independently
# across blocks.

[job]
task         = "vfm"
experiment   = "vision_sft_edge"
project      = "cosmos3"
group        = "causal_sft"
name         = "vision_causal_edge"
wandb_mode   = "offline"

[model]
max_num_tokens_after_packing             = 45056
joint_attn_implementation                = "teacher_forcing"
precision                                = "bfloat16"
causal_training_strategy                 = "teacher_forcing"
# Inclusive ranges used for per-sample causal geometry sampling.
teacher_forcing_block_size_min           = 1
teacher_forcing_block_size_max           = 4
teacher_forcing_history_blocks_min       = 1
teacher_forcing_history_blocks_max       = 32
# The original U+V sequence is capped at 45,056; Scheme B expands it to U+2V.
teacher_forcing_max_sequence_length      = 90112
teacher_forcing_dense_mode               = "per_sample"
# Debug only: rank 0 writes one teacher_forcing_sdpa_bool_mask.png under OUTPUT_ROOT.
teacher_forcing_visualize_sdpa_mask      = false # true

[model.ema]
enabled         = true
rate            = 0.1
iteration_shift = 0

[model.parallelism]
data_parallel_shard_degree     = -1
data_parallel_replicate_degree = 1

[model.compile]
enabled         = false
compile_dynamic = true

[model.activation_checkpointing]
mode               = "full"
save_ops_regex     = ["fmha"]
preserve_rng_state = true
determinism_check  = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
betas          = [0.9, 0.95]
eps            = 1.0e-6
fused          = true
keys_to_select = [
    "moe_gen",
    "time_embedder",
    "vae2llm",
    "llm2vae",
    "k_norm_und_for_gen",
]
lr           = 1.0e-4
weight_decay = 0

[scheduler]
cycle_lengths      = [1000]
f_max              = [1.0]
f_min              = [0.0]
f_start            = [0.0]
verbosity_interval = 0
warm_up_steps      = [50]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 2
logging_iter            = 1
max_iter                = 500

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = false

[trainer.callbacks.grad_clip]
clip_norm    = 0.1
force_finite = true

[checkpoint]
keys_to_skip_loading = ["net_ema."]
load_path            = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter            = 100

[dataloader_train]
# max_samples_per_batch = 8
max_sequence_length = 45056
max_caption_tokens   = 2048
